version: "1.0"

services:
  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "28017:27017"

  app:
    image: employee-service:1.0
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    environment:
      SERVER_PORT: 8081
      MONGO_DB_HOST_NAME: mongo
      MONGO_PORT: 27017
      MONGO_DB_NAME: mongoEmployeeService